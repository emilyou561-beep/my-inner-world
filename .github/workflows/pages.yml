# Builds the site and publishes it to GitHub Pages on every push to main.
# Live at https://emilyou561-beep.github.io/my-inner-world/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add a way back to Emily's desk
        run: |
          for f in dist/*.html; do
            sed -i 's#</body>#<a href="https://emilyou561-beep.github.io/" style="position:fixed;left:16px;bottom:14px;z-index:99;font:12px ui-monospace,monospace;color:\#e8e8e8;background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.18);padding:9px 13px;border-radius:999px;text-decoration:none;letter-spacing:.04em">\&larr; Back to the desk</a></body>#' "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
